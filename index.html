<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b101a" />
  <meta name="description" content="KKT Voice Guide — เว็บหน้าเดียวสำหรับเลือกงานและกดฟังไกด์เสียง" />
  <title>KKT Voice Guide</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/layout.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-wrap">
      <div class="header-topline">
        <a class="brand" id="brandLink" href="./" aria-label="กลับไปหน้ารวมงาน">
          <img id="logo" class="logo" src="./logo.png" alt="KKT Voice Guide" />
          <span id="brandTitle">KKT Voice Guide</span>
        </a>
        <div id="jobLink" class="job-link" aria-live="polite"></div>
      </div>

      <div class="controls" aria-label="เครื่องมือเสียง">
        <label class="range-control">
          <span aria-hidden="true">🔉</span>
          <span class="sr-only">ปรับเสียง</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="ปรับเสียง" />
        </label>
        <label class="range-control">
          <span aria-hidden="true">⏩</span>
          <span class="sr-only">ความเร็ว</span>
          <input id="speed" type="range" min="0.6" max="1.25" step="0.05" value="1" aria-label="ความเร็ว" />
        </label>
        <label class="search-control">
          <span class="sr-only">ค้นหาเสียง</span>
          <input id="search" type="search" placeholder="ค้นหาเสียง / คำอ่าน" aria-label="ค้นหาเสียง" autocomplete="off" />
        </label>
        <button id="shareJob" class="btn primary" type="button">🔗 คัดลอกลิงก์งาน</button>
        <button id="installBtn" class="btn" type="button" hidden>📲 ติดตั้ง</button>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </div>
  </header>

  <main class="page-shell">
    <div class="layout">
      <aside class="sidebar" aria-label="เลือกงาน">
        <div class="sidebar-heading">เลือกงาน</div>
        <p class="sidebar-help">กดรหัสงานเพื่อเปิดรายการเสียงและสร้างลิงก์ตรง</p>
        <nav id="sidebar" class="job-list" aria-label="รายการงาน"></nav>
      </aside>

      <section class="content" aria-labelledby="contentTitle">
        <header class="content-header">
          <div>
            <p id="contentEyebrow" class="eyebrow">เสียงทั้งหมด</p>
            <h1 id="contentTitle">เลือกงานเพื่อเริ่มฟัง</h1>
            <p id="contentSubtitle" class="content-subtitle">เลือกงานจากแถบด้านซ้าย หรือกดรายการเสียงจากหน้ารวม</p>
          </div>
          <a id="jobLinkButton" class="job-code-link" href="./" hidden></a>
        </header>

        <div id="grid" class="grid" role="list" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden>
          <strong id="emptyTitle">ไม่พบรายการเสียง</strong>
          <p id="emptyText">ลองเปลี่ยนคำค้นหรือเลือกงานอื่น</p>
        </div>
        <p class="footer">Tips: <kbd>1–9</kbd> เล่นรายการที่เห็น | <kbd>Space</kbd> หยุดทั้งหมด | โหมด Solo เปิดอยู่</p>
      </section>
    </div>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
